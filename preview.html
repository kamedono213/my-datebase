<!doctype html>
<html lang="ja" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="端末内だけで使える、シンプルな個人用知識データベース">
  <style>
:root {
  color-scheme: light;
  --bg: #f7f7f5;
  --surface: #ffffff;
  --surface-2: #efefec;
  --text: #20201e;
  --muted: #777770;
  --line: #e3e3de;
  --accent: #3559d8;
  --accent-soft: #e9edff;
  --danger: #b53c3c;
  --shadow: 0 8px 28px rgba(20, 20, 18, .07);
  --radius: 18px;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
}

html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #141413;
  --surface: #1e1e1c;
  --surface-2: #2a2a27;
  --text: #f4f4ef;
  --muted: #aaa9a1;
  --line: #343430;
  --accent: #8fa5ff;
  --accent-soft: #283154;
  --danger: #ff9292;
  --shadow: 0 8px 28px rgba(0, 0, 0, .25);
}

@media (prefers-color-scheme: dark) {
  html[data-theme="system"] {
    color-scheme: dark;
    --bg: #141413;
    --surface: #1e1e1c;
    --surface-2: #2a2a27;
    --text: #f4f4ef;
    --muted: #aaa9a1;
    --line: #343430;
    --accent: #8fa5ff;
    --accent-soft: #283154;
    --danger: #ff9292;
    --shadow: 0 8px 28px rgba(0, 0, 0, .25);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
button, select, input { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }

.app-shell { min-height: 100dvh; max-width: 1120px; margin: 0 auto; }
.topbar, .editor-header, .sub-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
  background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid transparent;
}
.topbar { flex-wrap: wrap; }
.topbar h1, .dialog-header h2, .sub-header h2 { margin: 2px 0 0; font-size: 1.45rem; letter-spacing: -.03em; }
.eyebrow { font-size: .67rem; letter-spacing: .16em; color: var(--muted); font-weight: 800; }
.brand-wrap { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand-copy { min-width: 0; flex: 1; }
.app-title-row { display: flex; align-items: center; min-width: 0; gap: 5px; }
.app-title-input {
  min-width: 0; width: 100%; max-width: 360px; border: 0; outline: 0; background: transparent; color: var(--text);
  font-size: 1.45rem; font-weight: 850; letter-spacing: -.03em; padding: 2px 3px; border-radius: 7px;
  text-overflow: ellipsis;
}
.app-title-input:focus { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.title-edit-mark { color: var(--muted); font-size: .8rem; flex: 0 0 auto; }
.home-btn {
  flex: 0 0 auto; width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 15px;
  background: var(--surface); color: var(--text); font-size: 1.55rem; line-height: 1; box-shadow: 0 1px 0 rgba(0,0,0,.02);
}
.home-btn:active { transform: scale(.97); }
.top-actions, .editor-header-actions { display: flex; gap: 6px; flex: 0 0 auto; }
.top-actions { margin-left: auto; }
.icon-btn {
  width: 42px; height: 42px; border: 0; border-radius: 14px;
  background: var(--surface); box-shadow: 0 0 0 1px var(--line); font-size: 1.25rem;
}
.icon-btn.active { background: var(--accent-soft); color: var(--accent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, var(--line)); }

.library-view { padding: 8px 14px calc(104px + env(safe-area-inset-bottom)); }
.search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: stretch; }
.search-box {
  min-width: 0; display: flex; gap: 8px; align-items: center; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 14px; background: var(--surface);
}
.search-box input { width: 100%; min-width: 0; padding: 12px 0; border: 0; outline: 0; background: transparent; }
#sortSelect, .wide-select {
  border: 1px solid var(--line); border-radius: 14px; padding: 0 12px; background: var(--surface); outline: 0;
}
#sortSelect { max-width: 132px; }
.quick-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 2px 4px; }
.ghost-btn { border: 0; background: transparent; color: var(--accent); padding: 8px 4px; font-weight: 700; }
.muted { color: var(--muted); font-size: .86rem; }

.tag-strip { display: flex; gap: 7px; overflow-x: auto; padding: 8px 0 12px; scrollbar-width: none; }
.tag-strip::-webkit-scrollbar { display: none; }
.tag-chip {
  flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  border-radius: 999px; padding: 7px 10px; font-size: .82rem;
}
.tag-chip.active { color: var(--accent); background: var(--accent-soft); border-color: transparent; font-weight: 750; }

.note-list { display: grid; gap: 10px; }
.note-card {
  position: relative; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  padding: 15px; box-shadow: 0 1px 0 rgba(0,0,0,.01); transition: transform .12s ease, box-shadow .12s ease;
}
.note-card:active { transform: scale(.995); }
.note-card-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.note-title { font-size: 1.04rem; font-weight: 800; line-height: 1.35; overflow-wrap: anywhere; }
.card-marks { display: flex; gap: 5px; color: var(--muted); font-size: .86rem; }
.note-preview { margin-top: 8px; color: var(--muted); line-height: 1.55; font-size: .92rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.note-preview a { color: var(--accent); }
.note-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 12px; }
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.card-tag { padding: 4px 7px; border-radius: 8px; background: var(--surface-2); color: var(--muted); font-size: .72rem; }
.note-date { flex: 0 0 auto; font-size: .72rem; color: var(--muted); }

.fab {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 12;
  width: 60px; height: 60px; border: 0; border-radius: 21px; background: var(--text); color: var(--bg);
  font-size: 2rem; line-height: 1; box-shadow: var(--shadow);
}
.empty-state { text-align: center; color: var(--muted); padding: 70px 20px; display: grid; gap: 8px; justify-items: center; }
.empty-state[hidden] { display: none; }
.empty-icon { width: 54px; height: 54px; border-radius: 18px; display: grid; place-items: center; background: var(--surface-2); font-size: 1.5rem; }

.editor-view { min-height: 100dvh; background: var(--surface); }
.editor-header { background: color-mix(in srgb, var(--surface) 92%, transparent); border-bottom-color: var(--line); }
.back-btn {
  min-width: 92px; min-height: 44px; border: 1px solid var(--line); border-radius: 13px;
  background: var(--bg); color: var(--text); padding: 9px 13px; font-weight: 800; text-align: center;
}
.back-btn:active { transform: scale(.98); }
.save-state { font-size: .78rem; color: var(--muted); }
.editor-scroll { padding: 18px 18px calc(50px + env(safe-area-inset-bottom)); max-width: 820px; margin: 0 auto; }
.title-input, .tags-input, .content-input { display: block; width: 100%; border: 0; outline: 0; background: transparent; }
.title-input { font-weight: 850; font-size: 1.8rem; letter-spacing: -.035em; padding: 8px 0; }
.tags-input { color: var(--accent); padding: 7px 0 14px; border-bottom: 1px solid var(--line); }
.format-toolbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 0 4px; }
.format-toolbar button, .small-btn { border: 1px solid var(--line); border-radius: 9px; background: var(--bg); padding: 7px 9px; font-size: .78rem; }
.content-input { min-height: 46dvh; resize: vertical; padding: 16px 0; font-size: 1rem; line-height: 1.75; }
.editor-section { border-top: 1px solid var(--line); padding: 18px 0; }
.editor-section h2 { margin: 0 0 10px; font-size: .92rem; }
.section-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.file-btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.attachment-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.attachment-card { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.attachment-card img { width: 100%; height: 100%; object-fit: cover; }
.attachment-remove { position: absolute; top: 5px; right: 5px; width: 28px; height: 28px; border: 0; border-radius: 999px; background: rgba(0,0,0,.68); color: white; }
.related-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.related-pill { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; font-size: .8rem; background: var(--surface); }
.related-pill button { border: 0; background: transparent; color: var(--muted); padding: 0 2px; }
.actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.primary-btn, .secondary-btn, .danger-btn { min-height: 44px; border-radius: 12px; padding: 10px 12px; font-weight: 720; }
.primary-btn { border: 0; background: var(--text); color: var(--bg); }
.secondary-btn { border: 1px solid var(--line); background: var(--surface); }
.danger-btn { border: 1px solid color-mix(in srgb, var(--danger) 35%, var(--line)); background: transparent; color: var(--danger); grid-column: 1 / -1; }
.wide-select { width: 100%; min-height: 44px; }

.trash-view { min-height: 100dvh; padding-bottom: 40px; }
.sub-header { border-bottom: 1px solid var(--line); }
.sub-header > * { width: 42px; }
.sub-header h2 { width: auto; flex: 1; text-align: center; }
.trash-list { padding: 14px; display: grid; gap: 10px; }
.trash-card { border: 1px solid var(--line); border-radius: 15px; background: var(--surface); padding: 14px; }
.trash-card-actions { display: flex; gap: 8px; margin-top: 10px; }
.trash-card-actions button { flex: 1; }

.settings-dialog { width: min(92vw, 520px); max-height: 86dvh; border: 0; padding: 0; background: transparent; }
.settings-dialog::backdrop { background: rgba(0,0,0,.38); backdrop-filter: blur(2px); }
.dialog-card { background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); }
.dialog-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.field-label { display: block; font-size: .78rem; font-weight: 700; margin: 0 0 7px; color: var(--muted); }
.settings-block { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
.settings-block p { line-height: 1.5; }
.backup-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.privacy-note { margin-top: 22px; padding: 12px; border-radius: 12px; background: var(--surface-2); color: var(--muted); font-size: .78rem; }

.toast { position: fixed; z-index: 50; left: 50%; bottom: calc(94px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--bg); border-radius: 999px; padding: 9px 14px; font-size: .82rem; box-shadow: var(--shadow); white-space: nowrap; }

@media (min-width: 760px) {
  .app-shell { padding: 0 20px; }
  .topbar { padding-left: 6px; padding-right: 6px; }
  .library-view { padding-left: 0; padding-right: 0; }
  .note-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .fab { right: max(28px, calc((100vw - 1120px) / 2 + 28px)); }
  .editor-view { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
}

@media (min-width: 1040px) {
  .note-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

  </style>
  <title>知識データベース</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-wrap">

        <div class="brand-copy">
          <div class="eyebrow">MY KNOWLEDGE</div>
          <div class="app-title-row">
            <input id="appTitleInput" class="app-title-input" type="text" value="知識データベース" maxlength="60" aria-label="データベース名">
            <span class="title-edit-mark" aria-hidden="true">✎</span>
          </div>

      </div>

    <section id="editorView" class="view editor-view" hidden aria-label="知識を編集">

        <div class="editor-header-actions">
          <button id="pinButton" class="icon-btn" type="button" aria-label="ピン留め">📌</button>
          <button id="favoriteButton" class="icon-btn" type="button" aria-label="お気に入り">☆</button>
        </div>
      </header>

      <div class="editor-scroll">
        <input id="titleInput" class="title-input" type="text" placeholder="タイトル" maxlength="200">
        <input id="tagsInput" class="tags-input" type="text" placeholder="タグ（カンマ区切り）">

        <div class="format-toolbar" aria-label="文章の書式">
          <button type="button" data-format="heading">見出し</button>
          <button type="button" data-format="bold">太字</button>
          <button type="button" data-format="bullet">・リスト</button>
          <button type="button" data-format="check">☐ チェック</button>
        </div>

        <textarea id="contentInput" class="content-input" placeholder="ここに内容を書きます。URLは一覧でも開けます。"></textarea>

        <section class="editor-section">
          <div class="section-title-row">
            <h2>画像</h2>
            <label class="small-btn file-btn">＋ 追加<input id="attachmentInput" type="file" accept="image/*" multiple hidden></label>
          </div>

        <section class="editor-section">
          <h2>関連メモ</h2>

        <section class="editor-section actions-grid">
          <button id="copyTitleButton" class="secondary-btn" type="button">タイトルをコピー</button>
          <button id="copyBodyButton" class="secondary-btn" type="button">本文をコピー</button>
          <button id="copyAllButton" class="secondary-btn" type="button">全部コピー</button>
          <button id="duplicateButton" class="secondary-btn" type="button">複製</button>
          <button id="deleteButton" class="danger-btn" type="button">ゴミ箱へ</button>

        <button id="trashBackButton" class="icon-btn" type="button" aria-label="一覧に戻る">‹</button>
        <h2>ゴミ箱</h2>

  <dialog id="settingsDialog" class="settings-dialog">
    <form method="dialog" class="dialog-card">
      <header class="dialog-header">
        <div>
          <div class="eyebrow">SETTINGS</div>
          <h2>設定・バックアップ</h2>

      <select id="themeSelect" class="wide-select">
        <option value="system">端末に合わせる</option>
        <option value="light">ライト</option>
        <option value="dark">ダーク</option>
      </select>

      <div class="settings-block">
        <strong>バックアップ</strong>
        <p class="muted">全メモ・タグ・画像・設定を1つのJSONファイルに保存します。</p>
        <div class="backup-actions">
          <button id="exportButton" class="primary-btn" type="button">書き出す</button>
          <label class="secondary-btn file-btn">読み込む<input id="importInput" type="file" accept="application/json,.json" hidden></label>
        </div>
      </div>

      <div class="privacy-note">データはこの端末のブラウザ内に保存されます。</div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
const makeId = (now) => `note-${now}-${Math.random().toString(36).slice(2, 10)}`;

function normalizeTags(tags = []) {
  const seen = new Set();
  const output = [];
  for (const raw of tags) {
    const tag = String(raw ?? '').trim();
    if (!tag) continue;
    const key = tag.toLocaleLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    output.push(tag);
  }
  return output;
}

function createNote(input = {}, now = Date.now()) {
  return {
    id: input.id || makeId(now),
    title: String(input.title ?? ''),
    content: String(input.content ?? ''),
    tags: normalizeTags(input.tags ?? []),
    favorite: Boolean(input.favorite),
    pinned: Boolean(input.pinned),
    createdAt: Number.isFinite(input.createdAt) ? input.createdAt : now,
    updatedAt: Number.isFinite(input.updatedAt) ? input.updatedAt : now,
    deletedAt: input.deletedAt == null ? null : Number(input.deletedAt),
    relatedIds: Array.isArray(input.relatedIds) ? [...new Set(input.relatedIds.map(String))] : [],
    attachments: Array.isArray(input.attachments) ? input.attachments.map((a) => ({ ...a })) : [],
  };
}

function matchesSearch(note, query = '') {
  const q = String(query).trim().toLocaleLowerCase();
  if (!q) return true;
  const haystack = [note.title, note.content, ...(note.tags ?? [])]
    .join('\n')
    .toLocaleLowerCase();
  return q.split(/\s+/).every((token) => haystack.includes(token));
}

function compareBase(a, b, sort) {
  if (sort === 'created') return b.createdAt - a.createdAt;
  if (sort === 'title') return a.title.localeCompare(b.title, 'ja', { sensitivity: 'base' });
  if (sort === 'favorite') {
    const fav = Number(b.favorite) - Number(a.favorite);
    return fav || b.updatedAt - a.updatedAt;
  }
  return b.updatedAt - a.updatedAt;
}

function filterAndSortNotes(notes, options = {}) {
  const {
    query = '',
    tags = [],
    sort = 'updated',
    includeDeleted = false,
    onlyDeleted = false,
  } = options;
  const normalizedFilterTags = normalizeTags(tags).map((tag) => tag.toLocaleLowerCase());

  return [...notes]
    .filter((note) => {
      const deleted = note.deletedAt != null;
      if (onlyDeleted && !deleted) return false;
      if (!onlyDeleted && !includeDeleted && deleted) return false;
      if (!matchesSearch(note, query)) return false;
      if (normalizedFilterTags.length) {
        const noteTags = (note.tags ?? []).map((tag) => String(tag).toLocaleLowerCase());
        if (!normalizedFilterTags.every((tag) => noteTags.includes(tag))) return false;
      }
      return true;
    })
    .sort((a, b) => {
      const pin = Number(b.pinned) - Number(a.pinned);
      if (pin) return pin;
      return compareBase(a, b, sort);
    });
}

function validateBackup(data) {
  if (!data || typeof data !== 'object') return false;
  if (data.version !== 1 || !Array.isArray(data.notes) || !data.settings || typeof data.settings !== 'object') return false;
  return data.notes.every((note) => {
    if (!note || typeof note !== 'object') return false;
    if (typeof note.id !== 'string') return false;
    if (typeof note.title !== 'string' || typeof note.content !== 'string') return false;
    if (!Array.isArray(note.tags) || !Array.isArray(note.relatedIds) || !Array.isArray(note.attachments)) return false;
    if (!Number.isFinite(note.createdAt) || !Number.isFinite(note.updatedAt)) return false;
    if (!(note.deletedAt == null || Number.isFinite(note.deletedAt))) return false;
    return true;
  });
}


const PREVIEW_STORE_KEY = 'personal-knowledge-db-preview-v1';
let previewMemory = { notes: [], settings: {} };

function readPreviewStore() {
  try {
    const raw = localStorage.getItem(PREVIEW_STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.notes) && parsed.settings && typeof parsed.settings === 'object') {
        previewMemory = parsed;
      }
    }
  } catch (_) {}
  return previewMemory;
}

function writePreviewStore(data) {
  previewMemory = data;
  try { localStorage.setItem(PREVIEW_STORE_KEY, JSON.stringify(data)); } catch (_) {}
}

async function listNotes() {
  return readPreviewStore().notes.map((note) => createNote(note, note.createdAt));
}

async function putNote(note) {
  const store = readPreviewStore();
  const normalized = createNote(note, note.createdAt ?? Date.now());
  const idx = store.notes.findIndex((item) => item.id === normalized.id);
  if (idx >= 0) store.notes[idx] = normalized;
  else store.notes.push(normalized);
  writePreviewStore(store);
}

async function deleteNotePermanently(id) {
  const store = readPreviewStore();
  store.notes = store.notes.filter((note) => note.id !== id);
  writePreviewStore(store);
}

async function getSetting(key, fallback = null) {
  const store = readPreviewStore();
  return Object.prototype.hasOwnProperty.call(store.settings, key) ? store.settings[key] : fallback;
}

async function setSetting(key, value) {
  const store = readPreviewStore();
  store.settings[key] = value;
  writePreviewStore(store);
}

async function exportData() {
  const store = readPreviewStore();
  return {
    version: 1,
    exportedAt: new Date().toISOString(),
    notes: store.notes.map((note) => createNote(note, note.createdAt)),
    settings: { ...store.settings },
  };
}

async function importData(data) {
  if (!validateBackup(data)) throw new Error('バックアップ形式が正しくありません。');
  writePreviewStore({
    notes: data.notes.map((note) => createNote(note, note.createdAt)),
    settings: { ...data.settings },
  });
}

const $ = (id) => document.getElementById(id);
const DEFAULT_APP_TITLE = '知識データベース';

const els = {
  libraryView: $('libraryView'),
  editorView: $('editorView'),
  trashView: $('trashView'),
  searchInput: $('searchInput'),
  sortSelect: $('sortSelect'),
  tagFilters: $('tagFilters'),
  noteList: $('noteList'),
  emptyState: $('emptyState'),
  resultCount: $('resultCount'),
  addButton: $('addButton'),
  clipboardButton: $('clipboardButton'),
  randomButton: $('randomButton'),
  trashButton: $('trashButton'),
  settingsButton: $('settingsButton'),
  homeButton: $('homeButton'),
  appTitleInput: $('appTitleInput'),
  backButton: $('backButton'),
  saveState: $('saveState'),
  pinButton: $('pinButton'),
  favoriteButton: $('favoriteButton'),
  titleInput: $('titleInput'),
  tagsInput: $('tagsInput'),
  contentInput: $('contentInput'),
  copyTitleButton: $('copyTitleButton'),
  copyBodyButton: $('copyBodyButton'),
  copyAllButton: $('copyAllButton'),
  duplicateButton: $('duplicateButton'),
  deleteButton: $('deleteButton'),
  attachmentInput: $('attachmentInput'),
  attachmentList: $('attachmentList'),
  relatedSelect: $('relatedSelect'),
  relatedList: $('relatedList'),
  trashBackButton: $('trashBackButton'),
  trashList: $('trashList'),
  settingsDialog: $('settingsDialog'),
  themeSelect: $('themeSelect'),
  exportButton: $('exportButton'),
  importInput: $('importInput'),
  toast: $('toast'),
};

const state = {
  notes: [],
  activeNoteId: null,
  selectedTags: new Set(),
  query: '',
  sort: 'updated',
  autosaveTimer: null,
  toastTimer: null,
  appTitleTimer: null,
};

function currentNote() {
  return state.notes.find((note) => note.id === state.activeNoteId) || null;
}

function formatDate(timestamp) {
  if (!timestamp) return '';
  return new Intl.DateTimeFormat('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }).format(timestamp);
}

function showToast(message) {
  clearTimeout(state.toastTimer);
  els.toast.textContent = message;
  els.toast.hidden = false;
  state.toastTimer = setTimeout(() => { els.toast.hidden = true; }, 1800);
}

function showView(view) {
  els.libraryView.hidden = view !== 'library';
  els.editorView.hidden = view !== 'editor';
  els.trashView.hidden = view !== 'trash';
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function textWithLinks(container, text) {
  container.replaceChildren();
  const value = String(text || '');
  const regex = /(https?:\/\/[^\s]+)/gi;
  let last = 0;
  for (const match of value.matchAll(regex)) {
    const index = match.index ?? 0;
    container.append(document.createTextNode(value.slice(last, index)));
    const link = document.createElement('a');
    link.href = match[0];
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = match[0];
    link.addEventListener('click', (event) => event.stopPropagation());
    container.append(link);
    last = index + match[0].length;
  }
  container.append(document.createTextNode(value.slice(last)));
}

function collectAllTags() {
  const counts = new Map();
  for (const note of state.notes) {
    if (note.deletedAt != null) continue;
    for (const tag of note.tags || []) counts.set(tag, (counts.get(tag) || 0) + 1);
  }
  return [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'));
}

function renderTagFilters() {
  els.tagFilters.replaceChildren();
  for (const [tag, count] of collectAllTags()) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `tag-chip${state.selectedTags.has(tag) ? ' active' : ''}`;
    button.textContent = `${tag} ${count}`;
    button.addEventListener('click', () => {
      if (state.selectedTags.has(tag)) state.selectedTags.delete(tag);
      else state.selectedTags.add(tag);
      renderLibrary();
    });
    els.tagFilters.append(button);
  }
}

function renderLibrary() {
  renderTagFilters();
  const notes = filterAndSortNotes(state.notes, {
    query: state.query,
    tags: [...state.selectedTags],
    sort: state.sort,
  });

  els.noteList.replaceChildren();
  els.resultCount.textContent = `${notes.length}件`;
  els.emptyState.hidden = notes.length !== 0 || Boolean(state.query) || state.selectedTags.size > 0;

  if (notes.length === 0 && (state.query || state.selectedTags.size)) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<strong>該当する知識がありません</strong><span>検索語やタグを変えてみてください。</span>';
    els.noteList.append(empty);
    return;
  }

  for (const note of notes) {
    const card = document.createElement('article');
    card.className = 'note-card';
    card.tabIndex = 0;
    card.addEventListener('click', () => openEditor(note.id));
    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') openEditor(note.id);
    });

    const head = document.createElement('div');
    head.className = 'note-card-head';
    const title = document.createElement('div');
    title.className = 'note-title';
    title.textContent = note.title.trim() || '無題';
    const marks = document.createElement('div');
    marks.className = 'card-marks';
    marks.textContent = `${note.pinned ? '📌' : ''}${note.favorite ? '★' : ''}`;
    head.append(title, marks);

    const preview = document.createElement('div');
    preview.className = 'note-preview';
    const excerpt = note.content.trim().slice(0, 180) || '本文なし';
    textWithLinks(preview, excerpt);

    const meta = document.createElement('div');
    meta.className = 'note-meta';
    const tags = document.createElement('div');
    tags.className = 'card-tags';
    for (const tag of note.tags.slice(0, 4)) {
      const chip = document.createElement('span');
      chip.className = 'card-tag';
      chip.textContent = tag;
      tags.append(chip);
    }
    const date = document.createElement('span');
    date.className = 'note-date';
    date.textContent = formatDate(note.updatedAt);
    meta.append(tags, date);

    card.append(head, preview, meta);
    els.noteList.append(card);
  }
}

function updateEditorButtons(note) {
  els.pinButton.classList.toggle('active', note.pinned);
  els.favoriteButton.classList.toggle('active', note.favorite);
  els.favoriteButton.textContent = note.favorite ? '★' : '☆';
}

function renderAttachments(note) {
  els.attachmentList.replaceChildren();
  for (const attachment of note.attachments || []) {
    const card = document.createElement('div');
    card.className = 'attachment-card';
    const img = document.createElement('img');
    img.src = attachment.dataUrl;
    img.alt = attachment.name || '添付画像';
    img.loading = 'lazy';
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'attachment-remove';
    remove.textContent = '×';
    remove.setAttribute('aria-label', '画像を削除');
    remove.addEventListener('click', () => {
      note.attachments = note.attachments.filter((item) => item.id !== attachment.id);
      scheduleAutosave();
      renderAttachments(note);
    });
    card.append(img, remove);
    els.attachmentList.append(card);
  }
}

function renderRelated(note) {
  els.relatedSelect.replaceChildren();
  const base = document.createElement('option');
  base.value = '';
  base.textContent = '関連メモを追加…';
  els.relatedSelect.append(base);

  const candidates = state.notes
    .filter((item) => item.deletedAt == null && item.id !== note.id && !note.relatedIds.includes(item.id))
    .sort((a, b) => a.title.localeCompare(b.title, 'ja'));
  for (const item of candidates) {
    const option = document.createElement('option');
    option.value = item.id;
    option.textContent = item.title || '無題';
    els.relatedSelect.append(option);
  }

  els.relatedList.replaceChildren();
  for (const id of note.relatedIds) {
    const related = state.notes.find((item) => item.id === id && item.deletedAt == null);
    if (!related) continue;
    const pill = document.createElement('span');
    pill.className = 'related-pill';
    const open = document.createElement('button');
    open.type = 'button';
    open.textContent = related.title || '無題';
    open.addEventListener('click', async () => {
      await flushAutosave();
      openEditor(related.id);
    });
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.textContent = '×';
    remove.setAttribute('aria-label', '関連を解除');
    remove.addEventListener('click', () => {
      note.relatedIds = note.relatedIds.filter((relatedId) => relatedId !== id);
      scheduleAutosave();
      renderRelated(note);
    });
    pill.append(open, remove);
    els.relatedList.append(pill);
  }
}

async function openEditor(noteId = null, seed = null) {
  let note = noteId ? state.notes.find((item) => item.id === noteId) : null;
  if (!note) {
    note = createNote(seed || {});
    state.notes.push(note);
    await putNote(note);
  }
  state.activeNoteId = note.id;
  els.titleInput.value = note.title;
  els.tagsInput.value = note.tags.join(', ');
  els.contentInput.value = note.content;
  els.saveState.textContent = '保存済み';
  updateEditorButtons(note);
  renderAttachments(note);
  renderRelated(note);
  showView('editor');
  requestAnimationFrame(() => (note.title ? els.contentInput : els.titleInput).focus());
}

function syncInputsToNote() {
  const note = currentNote();
  if (!note) return null;
  note.title = els.titleInput.value;
  note.content = els.contentInput.value;
  note.tags = normalizeTags(els.tagsInput.value.split(/[,、]/));
  note.updatedAt = Date.now();
  return note;
}

async function saveActiveNote() {
  const note = syncInputsToNote();
  if (!note) return;
  els.saveState.textContent = '保存中…';
  await putNote(note);
  els.saveState.textContent = '保存済み';
  renderLibrary();
}

function scheduleAutosave() {
  clearTimeout(state.autosaveTimer);
  els.saveState.textContent = '未保存';
  state.autosaveTimer = setTimeout(saveActiveNote, 500);
}

async function flushAutosave() {
  if (!state.activeNoteId) return;
  if (state.autosaveTimer) {
    clearTimeout(state.autosaveTimer);
    state.autosaveTimer = null;
  }
  await saveActiveNote();
}

async function closeEditor() {
  await flushAutosave();
  state.activeNoteId = null;
  showView('library');
  renderLibrary();
}

async function writeClipboard(text) {
  try {
    if (navigator.clipboard?.writeText) {
      await navigator.clipboard.writeText(text);
    } else {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.append(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
    showToast('コピーしました');
  } catch {
    showToast('コピーできませんでした');
  }
}

async function createFromClipboard() {
  try {
    if (!navigator.clipboard?.readText) throw new Error('Clipboard unavailable');
    const content = await navigator.clipboard.readText();
    await openEditor(null, { content });
    if (content) showToast('本文に貼り付けました');
  } catch {
    await openEditor();
    showToast('クリップボードを読めないため空欄で作成しました');
  }
}

function insertFormatting(kind) {
  const textarea = els.contentInput;
  const start = textarea.selectionStart;
  const end = textarea.selectionEnd;
  const selected = textarea.value.slice(start, end);
  let before = '';
  let after = '';
  if (kind === 'heading') before = '# ';
  if (kind === 'bold') { before = '**'; after = '**'; }
  if (kind === 'bullet') before = '- ';
  if (kind === 'check') before = '- [ ] ';
  textarea.setRangeText(`${before}${selected}${after}`, start, end, 'end');
  textarea.focus();
  scheduleAutosave();
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function addAttachments(files) {
  const note = currentNote();
  if (!note) return;
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    if (file.size > 10 * 1024 * 1024) {
      showToast(`${file.name} は10MBを超えるため追加できません`);
      continue;
    }
    const dataUrl = await fileToDataUrl(file);
    note.attachments.push({
      id: `img-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
      name: file.name,
      type: file.type,
      dataUrl,
    });
  }
  renderAttachments(note);
  scheduleAutosave();
}

async function toggleFlag(key) {
  const note = currentNote();
  if (!note) return;
  note[key] = !note[key];
  note.updatedAt = Date.now();
  await putNote(note);
  updateEditorButtons(note);
  renderLibrary();
}

async function duplicateActive() {
  await flushAutosave();
  const note = currentNote();
  if (!note) return;
  const clone = createNote({
    title: `${note.title || '無題'}（コピー）`,
    content: note.content,
    tags: note.tags,
    attachments: note.attachments,
    relatedIds: note.relatedIds,
  });
  state.notes.push(clone);
  await putNote(clone);
  showToast('複製しました');
  await openEditor(clone.id);
}

async function moveActiveToTrash() {
  await flushAutosave();
  const note = currentNote();
  if (!note) return;
  note.deletedAt = Date.now();
  note.updatedAt = Date.now();
  await putNote(note);
  state.activeNoteId = null;
  showView('library');
  renderLibrary();
  showToast('ゴミ箱へ移動しました');
}

function renderTrash() {
  const notes = filterAndSortNotes(state.notes, { onlyDeleted: true, sort: 'updated' });
  els.trashList.replaceChildren();
  if (!notes.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<strong>ゴミ箱は空です</strong><span>削除した知識はここから復元できます。</span>';
    els.trashList.append(empty);
    return;
  }

  for (const note of notes) {
    const card = document.createElement('div');
    card.className = 'trash-card';
    const title = document.createElement('strong');
    title.textContent = note.title || '無題';
    const meta = document.createElement('div');
    meta.className = 'muted';
    meta.textContent = `削除: ${formatDate(note.deletedAt)}`;
    const actions = document.createElement('div');
    actions.className = 'trash-card-actions';
    const restore = document.createElement('button');
    restore.type = 'button';
    restore.className = 'secondary-btn';
    restore.textContent = '復元';
    restore.addEventListener('click', async () => {
      note.deletedAt = null;
      note.updatedAt = Date.now();
      await putNote(note);
      renderTrash();
      renderLibrary();
      showToast('復元しました');
    });
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'danger-btn';
    remove.style.gridColumn = 'auto';
    remove.textContent = '完全削除';
    remove.addEventListener('click', async () => {
      if (!confirm(`「${note.title || '無題'}」を完全に削除しますか？`)) return;
      await deleteNotePermanently(note.id);
      state.notes = state.notes.filter((item) => item.id !== note.id);
      renderTrash();
      renderLibrary();
      showToast('完全に削除しました');
    });
    actions.append(restore, remove);
    card.append(title, meta, actions);
    els.trashList.append(card);
  }
}

async function openRandomNote() {
  const candidates = state.notes.filter((note) => note.deletedAt == null);
  if (!candidates.length) return showToast('知識がまだありません');
  const note = candidates[Math.floor(Math.random() * candidates.length)];
  await openEditor(note.id);
}

function downloadJson(data) {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `knowledge-backup-${date}.json`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  els.themeSelect.value = theme;
}

function applyAppTitle(value) {
  const title = String(value || '').trim() || DEFAULT_APP_TITLE;
  els.appTitleInput.value = title;
  document.title = title;
  return title;
}

async function saveAppTitle() {
  clearTimeout(state.appTitleTimer);
  state.appTitleTimer = null;
  const title = applyAppTitle(els.appTitleInput.value);
  await setSetting('appTitle', title);
}

function scheduleAppTitleSave() {
  clearTimeout(state.appTitleTimer);
  document.title = els.appTitleInput.value.trim() || DEFAULT_APP_TITLE;
  state.appTitleTimer = setTimeout(saveAppTitle, 500);
}

async function goHome() {
  if (state.activeNoteId) {
    await flushAutosave();
    state.activeNoteId = null;
  }
  if (els.settingsDialog.open && typeof els.settingsDialog.close === 'function') els.settingsDialog.close();
  else els.settingsDialog.removeAttribute('open');
  showView('library');
  renderLibrary();
}

async function handleImport(file) {
  try {
    const data = JSON.parse(await file.text());
    await importData(data);
    state.notes = await listNotes();
    const theme = await getSetting('theme', 'system');
    applyTheme(theme);
    const appTitle = await getSetting('appTitle', '知識データベース');
    applyAppTitle(appTitle);
    state.selectedTags.clear();
    state.query = '';
    els.searchInput.value = '';
    renderLibrary();
    showToast('バックアップを読み込みました');
  } catch (error) {
    console.error(error);
    showToast('バックアップを読み込めませんでした');
  } finally {
    els.importInput.value = '';
  }
}

function wireEvents() {
  els.searchInput.addEventListener('input', () => {
    state.query = els.searchInput.value;
    renderLibrary();
  });
  els.sortSelect.addEventListener('change', () => {
    state.sort = els.sortSelect.value;
    renderLibrary();
  });
  els.addButton.addEventListener('click', () => openEditor());
  els.clipboardButton.addEventListener('click', createFromClipboard);
  els.randomButton.addEventListener('click', openRandomNote);
  els.trashButton.addEventListener('click', () => {
    renderTrash();
    showView('trash');
  });
  els.trashBackButton.addEventListener('click', () => showView('library'));
  els.backButton.addEventListener('click', closeEditor);
  els.homeButton.addEventListener('click', goHome);
  els.appTitleInput.addEventListener('input', scheduleAppTitleSave);
  els.appTitleInput.addEventListener('blur', saveAppTitle);

  for (const input of [els.titleInput, els.tagsInput, els.contentInput]) input.addEventListener('input', scheduleAutosave);

  els.favoriteButton.addEventListener('click', () => toggleFlag('favorite'));
  els.pinButton.addEventListener('click', () => toggleFlag('pinned'));
  els.copyTitleButton.addEventListener('click', () => writeClipboard(els.titleInput.value));
  els.copyBodyButton.addEventListener('click', () => writeClipboard(els.contentInput.value));
  els.copyAllButton.addEventListener('click', () => {
    const note = syncInputsToNote();
    const tagLine = note.tags.length ? `\n\n#${note.tags.join(' #')}` : '';
    writeClipboard(`${note.title}\n\n${note.content}${tagLine}`.trim());
  });
  els.duplicateButton.addEventListener('click', duplicateActive);
  els.deleteButton.addEventListener('click', moveActiveToTrash);

  document.querySelectorAll('[data-format]').forEach((button) => {
    button.addEventListener('click', () => insertFormatting(button.dataset.format));
  });

  els.attachmentInput.addEventListener('change', async () => {
    await addAttachments([...els.attachmentInput.files]);
    els.attachmentInput.value = '';
  });

  els.relatedSelect.addEventListener('change', () => {
    const note = currentNote();
    if (!note || !els.relatedSelect.value) return;
    if (!note.relatedIds.includes(els.relatedSelect.value)) note.relatedIds.push(els.relatedSelect.value);
    els.relatedSelect.value = '';
    renderRelated(note);
    scheduleAutosave();
  });

  els.settingsButton.addEventListener('click', () => {
    if (typeof els.settingsDialog.showModal === 'function') els.settingsDialog.showModal();
    else els.settingsDialog.setAttribute('open', '');
  });
  els.themeSelect.addEventListener('change', async () => {
    applyTheme(els.themeSelect.value);
    await setSetting('theme', els.themeSelect.value);
  });
  els.exportButton.addEventListener('click', async () => {
    downloadJson(await exportData());
    showToast('バックアップを書き出しました');
  });
  els.importInput.addEventListener('change', () => {
    const [file] = els.importInput.files;
    if (file) handleImport(file);
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushAutosave();
  });
}

async function init() {
  const theme = await getSetting('theme', 'system');
  applyTheme(theme);
  const appTitle = await getSetting('appTitle', '知識データベース');
  applyAppTitle(appTitle);
  state.notes = await listNotes();
  wireEvents();
  renderLibrary();
  showView('library');

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('./sw.js').catch((error) => console.warn('Service worker registration failed', error));
  }
}

init().catch((error) => {
  console.error(error);
  alert('アプリを起動できませんでした。ブラウザを再読み込みしてください。');
});
