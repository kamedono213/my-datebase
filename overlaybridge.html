<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>overlay bridge</title></head>
<body>
<script type="module">
  import { putNote, getSetting, listNotes } from './src/db.js';
  // OverlayBubbleServiceの隠しWebViewから evaluateJavascript で呼ばれる保存関数。
  // 通常のUIは持たない、ネイティブのオーバーレイUIから既存のIndexedDBへ橋渡しするだけの役目。
  //
  // 重要: このページは https://localhost 経由で読み込まれる必要がある(WebViewAssetLoader経由)。
  // file:// で読み込むと、本体アプリ(Capacitorのデフォルトorigin https://localhost)とは
  // 別originになり、IndexedDBが別データベース扱いになって保存が本体に反映されない
  // (2026-09-16に発覚した不具合の根本原因)。
  //
  // __overlaySaveはasync関数なので、evaluateJavascriptの戻り値（同期的な返り値）は
  // 実際の保存完了を意味しない（PromiseはJSON化できずnullになる）。そのため結果は
  // AndroidBridge.onSaveResult(requestId, ok, message) でJava側へ明示的に報告する。
  window.__overlaySave = (requestId, title, content, tags) => {
    (async () => {
      try {
        if (!title && !content) {
          window.AndroidBridge?.onSaveResult(requestId, false, 'empty');
          return;
        }
        const tagList = Array.isArray(tags) ? tags : [];
        await putNote({ title, content, tags: tagList });
        window.AndroidBridge?.onSaveResult(requestId, true, 'ok');
      } catch (e) {
        window.AndroidBridge?.onSaveResult(requestId, false, (e && e.message) ? e.message : String(e));
      }
    })();
  };

  // タグ候補を返す。タグ作成ダイアログ経由の登録済みタグ(tagRegistry)だけでなく、
  // 既存メモに実際に付いているタグ全部を候補にする(自由入力時代のタグも拾うため)。
  window.__overlayGetTags = (requestId) => {
    (async () => {
      try {
        const registry = await getSetting('tagRegistry', []);
        const registryNames = Array.isArray(registry) ? registry.map((t) => t && t.name).filter(Boolean) : [];
        const notes = await listNotes();
        const usedNames = notes.flatMap((n) => (Array.isArray(n.tags) ? n.tags : []));
        const seen = new Set(registryNames.map((n) => n.toLocaleLowerCase()));
        const names = [...registryNames];
        for (const tag of usedNames) {
          const key = tag.toLocaleLowerCase();
          if (seen.has(key)) continue;
          seen.add(key);
          names.push(tag);
        }
        window.AndroidBridge?.onTagsResult(requestId, JSON.stringify(names));
      } catch (e) {
        window.AndroidBridge?.onTagsResult(requestId, '[]');
      }
    })();
  };

  window.__overlayReady = true;
</script>
</body>
</html>
